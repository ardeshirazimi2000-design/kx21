openapi: 3.1.0
info:
  title: Chamber Commissions API — سامانه کمیسیون‌های تخصصی
  version: 1.0.0
  description: 'REST API of the commissions platform. All business endpoints require `Authorization: Bearer <accessToken>`.


    Real-time: Socket.IO at `/socket.io` (auth: `{ token }`). Emit `meeting:join` with a meeting id, then receive `meeting.updated`, `attendance.updated`
    (officers), `quorum.updated`, `agenda.updated`, `comment.created`, `vote.opened`, `vote.progress`, `vote.closed`, and personal `notification`
    events.


    Errors: `{ error: { code, message, details? } }` with Persian messages.'
servers:
- url: http://localhost:4000
security:
- bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: &id001
              type: string
            message: *id001
            details:
              type: array
              items:
                type: object
                properties:
                  path: *id001
                  message: *id001
    Paged:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        total: &id002
          type: integer
        page: *id002
        pageSize: *id002
    Tokens:
      type: object
      properties:
        accessToken: *id001
        refreshToken: *id001
    QuorumRule:
      type: object
      properties:
        type:
          type: string
          enum:
          - majority
          - percent
          - fixed
          - two_thirds
        value:
          type: number
        countProxy: &id003
          type: boolean
        countOnline: *id003
    CommissionSettings:
      type: object
      properties:
        quorum:
          $ref: '#/components/schemas/QuorumRule'
        requireQuorumForVoting: *id003
        requireQuorumToStart: *id003
        allowProxy: *id003
        secretVoteDefault: *id003
        resultVisibility:
          type: string
          enum:
          - invitees
          - officers
        passRule:
          type: string
          enum:
          - majority_of_present
          - majority_of_cast
          - simple_majority
          - two_thirds_of_present
        allowParallelAgenda: *id003
        allowComments: *id003
        dueSoonDays: *id002
    MeetingStatus:
      type: string
      enum:
      - draft
      - scheduled
      - invitation_sent
      - checkin_open
      - in_progress
      - agenda_processing
      - minutes_draft
      - pending_approval
      - approved
      - archived
      - cancelled
    AttendanceStatus:
      type: string
      enum:
      - pending
      - present
      - online
      - proxy
      - manual_present
      - absent
      - excused
    Quorum:
      type: object
      properties:
        eligible: *id002
        present: *id002
        required: *id002
        reached: *id003
        attendingTotal: *id002
        explanation: *id001
        breakdown:
          type: object
          additionalProperties: *id002
    Attendance:
      type: object
      properties:
        user_id: &id004
          type: string
          format: uuid
        full_name: *id001
        role: *id001
        has_vote: *id003
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        method: *id001
        checked_in_at: &id005
          type: string
          format: date-time
        proxy_name: *id001
        note: *id001
    VoteResult:
      type: object
      properties:
        counts:
          type: object
          additionalProperties: *id002
        totalCast: *id002
        eligiblePresent: *id002
        participationPercent:
          type: number
        passed: *id003
        passRule: *id001
        summary: *id001
        quorumReached: *id003
    MeetingCreate:
      type: object
      required:
      - commissionId
      - title
      - scheduledAt
      properties:
        commissionId: *id004
        number: *id002
        title: *id001
        scheduledAt: *id005
        durationMinutes: *id002
        location: *id001
        onlineLink: *id001
        type:
          type: string
          enum:
          - in_person
          - online
          - hybrid
        inviteAllMembers: *id003
        schedule: *id003
        invitees:
          type: array
          items:
            type: object
            properties:
              userId: *id004
              role: *id001
              hasVote: *id003
        agenda:
          type: array
          items:
            type: object
            properties:
              title: *id001
              description: *id001
              priority: *id001
              durationMinutes: *id002
              presenterId: *id004
              issueId: *id004
    MeetingDetail:
      type: object
      properties:
        id: *id004
        number: *id002
        title: *id001
        status:
          $ref: '#/components/schemas/MeetingStatus'
        scheduled_at: *id005
        settings:
          $ref: '#/components/schemas/CommissionSettings'
        capabilities:
          type: array
          items: *id001
        availableActions:
          type: array
          items: *id001
        checkinOpen: *id003
        my:
          type: object
          properties:
            role: *id001
            hasVote: *id003
            attendance:
              $ref: '#/components/schemas/Attendance'
        invitees:
          type: array
          items:
            $ref: '#/components/schemas/Attendance'
        quorum:
          $ref: '#/components/schemas/Quorum'
        agenda:
          type: array
          items:
            type: object
        votes:
          type: array
          items:
            type: object
        minutes:
          type: object
        documents:
          type: array
          items:
            type: object
    ResolutionCreate:
      type: object
      required:
      - commissionId
      - text
      properties:
        commissionId: *id004
        meetingId: *id004
        agendaItemId: *id004
        voteSessionId: *id004
        text: *id001
        ownerId: *id004
        addressee: *id001
        dueDate: &id006
          type: string
          format: date
          example: '2026-10-20'
        priority:
          type: string
          enum:
          - low
          - normal
          - high
          - urgent
        kpi: *id001
paths:
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: ورود با ایمیل/موبایل و رمز
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found or not visible
        '409':
          description: Conflict (state machine / business rule)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: If MFA is enabled returns {mfaRequired, mfaToken}. Rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier: *id001
                password: *id001
                device: *id001
