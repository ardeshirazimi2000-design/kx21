server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 60m;

  # Resolve office-api through Docker's DNS on each request (cached 10s), so a rebuilt or restarted api container
  # with a new IP is found again and nginx starts even while the api is down.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $office_api http://office-api:4100;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass $office_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    error_page 502 503 504 = @api_down;
  }

  # The api is not reachable: answer in the api's own error format so the web app shows a clear message.
  location @api_down {
    default_type application/json;
    charset utf-8;
    return 503 '{"error":{"code":"service_unavailable","message":"سرویس اتوماسیون اداری در دسترس نیست؛ چند لحظه بعد دوباره تلاش کنید یا به مدیر سیستم اطلاع دهید"}}';
  }

  location /health { proxy_pass $office_api; }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
