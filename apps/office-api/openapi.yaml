openapi: 3.1.0
info:
  title: Office Automation API — اتوماسیون اداری
  version: 1.0.0
  description: 'REST API of the office automation system (correspondence, workflow, archive, users and access, notifications, reports, integration).


    Business endpoints require `Authorization: Bearer <accessToken>`. Errors: `{ error: { code, message, details? } }` with Persian messages.
    Lists return `{ items, total, page, pageSize }`. Letters that are not visible to the caller answer 404.'
servers:
- url: http://localhost:4100
security:
- bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: &id001
              type: string
            message: *id001
            details:
              type: array
              items:
                type: object
                properties:
                  path: *id001
                  message: *id001
    Paged:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        total: &id002
          type: integer
        page: *id002
        pageSize: *id002
    Tokens:
      type: object
      properties:
        accessToken: *id001
        refreshToken: *id001
        mfaRequired: &id005
          type: boolean
        mfaToken: *id001
    Recipient:
      type: object
      properties:
        userId: &id003
          type: string
          format: uuid
        positionId: *id003
        unitId: *id003
        kind:
          type: string
          enum:
          - to
          - cc
    LetterCreate:
      type: object
      required:
      - kind
      - subject
      properties:
        kind:
          type: string
          enum:
          - incoming
          - outgoing
          - internal
        subject: *id001
        body: *id001
        summary: *id001
        externalParty: *id001
        externalOrg: *id001
        externalNumber: *id001
        externalDate: &id004
          type: string
          format: date
          example: '2026-10-20'
        source:
          type: string
          enum:
          - manual
          - email
          - scan
          - api
        deliveryMethod: *id001
        priority:
          type: string
          enum:
          - low
          - normal
          - high
          - urgent
        confidentiality:
          type: integer
          minimum: 0
          maximum: 2
        ownerUnitId: *id003
        replyToId: *id003
        dueDate: *id004
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        register: *id005
        workflow:
          type: string
          description: workflow definition key to start
        bodyFormat:
          type: string
          enum:
          - text
          - html
          description: 'html: body from the letter editor, sanitised server-side'
        templateId: *id003
        signatoryId:
          type: string
          format: uuid
          description: designated signatory (needs letter.sign); only they can sign
    WorkflowStep:
      type: object
      properties:
        key: *id001
        name: *id001
        type:
          type: string
          enum:
          - review
          - approve
          - sign
          - archive
          - notify
        assignee: &id006
          type: object
          properties:
            kind:
              type: string
              enum:
              - user
              - position
              - role
              - unit_manager
              - owner_unit_manager
              - initiator_manager
              - context_user
            value: *id001
        slaHours:
          type: number
        remindBeforeHours:
          type: number
        escalateTo: *id006
        onReject:
          type: string
          description: '''end'' or a previous step key'
        condition:
          type: object
          properties:
            field:
              type: string
              enum:
              - priority
              - kind
              - confidentiality
              - source
            op:
              type: string
              enum:
              - eq
              - neq
              - in
            value: {}
        archiveFolderId: *id003
    WorkflowDefinition:
      type: object
      properties:
        key: *id001
        name: *id001
        description: *id001
        appliesTo:
          type: array
          items:
            type: string
            enum:
            - incoming
            - outgoing
            - internal
        definition:
          type: object
          properties:
            steps:
              type: array
              items:
                $ref: '#/components/schemas/WorkflowStep'
            completeStatus:
              type: string
              enum:
              - approved
              - signed
              - archived
    RouteTargets:
      type: object
      properties:
        targets:
          type: array
          items:
            type: object
            properties:
              userId: *id003
              positionId: *id003
              action:
                type: string
                enum:
                - refer
                - review
                - approve
                - sign
                - archive
                - info
                - follow_up
              instruction: *id001
              dueAt: &id007
                type: string
                format: date-time
        parentId: *id003
        completeMine: *id005
    EventEnvelope:
      type: object
      properties:
        id: *id001
        type:
          type: string
          enum:
          - resolution.created
          - resolution.updated
          - meeting.updated
          - referral.updated
          - integration.ping
        occurredAt: *id007
        data:
          type: object
          properties:
            id: *id001
paths:
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: ورود (نام کاربری، ایمیل یا موبایل)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found or not visible
        '409':
          description: Conflict (state / business rule)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Returns tokens, or { mfaRequired, mfaToken } when TOTP is enabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier: *id001
                password: *id001
  /api/auth/mfa/verify:
    post:
      tags:
      - Auth
      summary: تکمیل ورود دومرحله‌ای
