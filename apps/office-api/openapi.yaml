    patch:
      tags:
      - Correspondence
      summary: ویرایش (فقط پیش‌نویس/ثبت‌شده و امضانشده)
      responses:
        '200':
          description: OK
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found or not visible
        '409':
          description: Conflict (state / business rule)
          content:
