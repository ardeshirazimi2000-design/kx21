      - Correspondence
      summary: جزئیات نامه با ارجاعات، گردش‌ها، امضاها و اقدام‌های مجاز (my)
      responses:
        '200':
          description: OK
        '400':
          description: Validation error
          content:
            application/json:
              schema:
