name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kx
          POSTGRES_PASSWORD: kx
          POSTGRES_DB: kx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kx:kx@localhost:5432/kx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Poppler renders presented PDF pages; the API tests exercise it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # The backup/restore test runs pg_dump/pg_restore/psql: they must be the major version of the database service
      # (a newer pg_dump writes settings an older server rejects), so install the 16 client from the PostgreSQL apt
      # repository and put it first on PATH.
      - name: PostgreSQL 16 client tools
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
      - run: npm ci
      - run: npm run build -w @kx/shared
      - run: npm run typecheck
      - name: Unit tests (business rules)
        run: npm test -w @kx/shared
      - name: Integration & E2E API tests (PostgreSQL + Socket.IO)
        run: npm test -w @kx/api
      - name: Office automation tests (incl. end-to-end with the meetings API)
        run: npm test -w @kx/office-api
      - run: npm run build -w @kx/api
      - run: npm run build -w @kx/web
      - run: npm run build -w @kx/office-api
      - run: npm run build -w @kx/office-web

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build shared package
        run: npm ci && npm run build -w @kx/shared
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - name: Bundle (Android JS)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/mobile-export
