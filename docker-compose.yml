# Trial/staging stack. Easiest:  bash deploy/docker-install.sh
# (creates .env with secrets, starts everything on WEB_PORT=8000, loads demo data)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kx}
      POSTGRES_DB: kx
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kx"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://kx:${POSTGRES_PASSWORD:-kx}@db:5432/kx
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (at least 32 characters)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-expo}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-none}
      IDENTITY_API_URL: ${IDENTITY_API_URL:-https://s.api.ir/api/sw1/PersonInfo}
      IDENTITY_API_TOKEN: ${IDENTITY_API_TOKEN:-}
      IDENTITY_REQUIRED: ${IDENTITY_REQUIRED:-false}
      WEBINAR_URL: ${WEBINAR_URL:-}
      WEBINAR_APP_ID: ${WEBINAR_APP_ID:-kx-commissions}
      WEBINAR_APP_SECRET: ${WEBINAR_APP_SECRET:-}
      # Similar resolutions across networks: AI engine on this server (bash deploy/ai/install.sh).
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-bge-m3}
      AI_SIMILARITY_MIN: ${AI_SIMILARITY_MIN:-0.6}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Optional AI engine (Ollama + multilingual embedding model), started only with the "ai" profile:
  #   bash deploy/ai/install.sh
  # Not published on any host port: only the api container reaches it.
  ai:
    image: ollama/ollama:0.34.4
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ai-models:/root/.ollama

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8000}:80"

  # ───── Office automation (اتوماسیون اداری): separate service and database, integrated over REST + webhooks ─────
  office-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kx
      POSTGRES_PASSWORD: ${OFFICE_POSTGRES_PASSWORD:-kx}
      POSTGRES_DB: kx_office
    volumes:
      - office-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kx"]
      interval: 5s
      retries: 10

  office-api:
    build:
      context: .
      dockerfile: apps/office-api/Dockerfile
    environment:
      DATABASE_URL: postgres://kx:${OFFICE_POSTGRES_PASSWORD:-kx}@office-db:5432/kx_office
      JWT_SECRET: ${OFFICE_JWT_SECRET:?set OFFICE_JWT_SECRET (at least 32 characters)}
      DATA_ENCRYPTION_KEY: ${OFFICE_DATA_ENCRYPTION_KEY:?set OFFICE_DATA_ENCRYPTION_KEY (openssl rand -hex 32)}
      PUBLIC_URL: ${OFFICE_PUBLIC_URL:-http://localhost:8100}
      CORS_ORIGINS: ${OFFICE_PUBLIC_URL:-http://localhost:8100}
      MFA_REQUIRED_ROLES: ${OFFICE_MFA_REQUIRED_ROLES:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      EMAIL_PROVIDER: ${OFFICE_EMAIL_PROVIDER:-log}
      SMTP_URL: ${OFFICE_SMTP_URL:-}
      ADMIN_USERNAME: ${OFFICE_ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${OFFICE_ADMIN_PASSWORD:-}
    volumes:
      - office-storage:/data/storage
    depends_on:
      office-db:
        condition: service_healthy

  office-web:
    build:
      context: .
      dockerfile: apps/office-web/Dockerfile
    depends_on:
      - office-api
    ports:
      - "${OFFICE_WEB_PORT:-8100}:80"

volumes:
  db-data:
  uploads:
  office-db-data:
  office-storage:
  ai-models:
