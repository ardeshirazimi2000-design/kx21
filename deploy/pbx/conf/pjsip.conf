; Rasa PBX — static PJSIP configuration (docs/communications/telephony.md).
; Extensions are not defined here: Rasa generates rasa/pjsip_extensions.conf from its own data.
; The city-line gateway (FXO) is rasa/pjsip_trunk.conf, written at container start from PBX_TRUNK_* settings.

[global]
type=global
user_agent=Rasa PBX
; A request is matched to the trunk by its source address first (PBX_TRUNK_IP), then by the From user (phones), then
; by the user name it authenticates with (a gateway sends the caller's number in From, not "rasa-trunk").
endpoint_identifier_order=ip,username,auth_username
; No answer to unknown user names with different errors (no extension-number guessing).
default_realm=rasa

#include rasa-local/transport.conf

; ---- templates ----
[rasa-endpoint](!)
type=endpoint
transport=transport-udp
disallow=all
allow=alaw,ulaw,g722
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
allow_subscribe=no
send_pai=yes
device_state_busy_at=2

[rasa-aor](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=60

#tryinclude rasa-local/pjsip_trunk.conf
#tryinclude rasa/pjsip_extensions.conf
