; Rasa PBX — static dial plan (docs/communications/telephony.md).
; rasa/extensions_rasa.conf (generated by Rasa) holds [rasa-extensions] (one entry per live extension) and
; [rasa-inbound] (where city-line calls ring).

[general]
static=yes
writeprotect=yes
clearglobalvars=yes

[globals]
#include rasa-local/globals.conf

#tryinclude rasa/extensions_rasa.conf

; Every extension: other extensions and emergency numbers (9 + 110 / 115 / 125).
[rasa-internal]
include => rasa-extensions
include => rasa-emergency
exten => i,1,Playback(invalid)
 same => n,Hangup()

; Extensions whose owner holds communications.call.external: also the city line.
[rasa-external]
include => rasa-internal
include => rasa-outbound

[rasa-emergency]
exten => 9110,1,Goto(rasa-trunk-dial,110,1)
exten => 9115,1,Goto(rasa-trunk-dial,115,1)
exten => 9125,1,Goto(rasa-trunk-dial,125,1)

; City line, prefix 9. Only these shapes: local 8 digits, 0 + 10 digits (other cities and mobile).
; International (00…) and premium short numbers are not dialable (toll fraud).
[rasa-outbound]
exten => _9[2-9]XXXXXXX,1,Goto(rasa-trunk-dial,${EXTEN:1},1)
exten => _90[1-9]XXXXXXXXX,1,Goto(rasa-trunk-dial,${EXTEN:1},1)

[rasa-trunk-dial]
exten => _X.,1,Set(GROUP()=rasa-outbound)
 same => n,GotoIf($[${GROUP_COUNT(rasa-outbound)} > ${MAX_OUTBOUND}]?full)
 same => n,Dial(PJSIP/${EXTEN}@rasa-trunk,60)
 same => n,Hangup()
 same => n(full),Congestion(5)
 same => n,Hangup()

; Calls coming from the city-line gateway, whatever number it sends.
[rasa-from-trunk]
exten => _X.,1,Goto(rasa-inbound,s,1)
exten => s,1,Goto(rasa-inbound,s,1)

; Click-to-call from Rasa (AMI Originate): after the caller's own phone answers, the destination is dialled with the
; caller's own dial plan (rasa-internal or rasa-external), so Rasa cannot widen anyone's rights.
[rasa-originate]
exten => _X.,1,Set(RASA_CTX=${PJSIP_ENDPOINT(${RASA_FROM},context)})
 same => n,GotoIf($["${RASA_CTX}" = ""]?deny)
 same => n,Set(CALLERID(all)=${PJSIP_ENDPOINT(${RASA_FROM},callerid)})
 same => n,Goto(${RASA_CTX},${EXTEN},1)
 same => n(deny),Hangup()
