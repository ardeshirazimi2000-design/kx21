# Offline bundle of the commissions system (سامانهٔ کمیسیون‌های تخصصی): ready-built images, no internet needed.
# Installed and started by install.sh; the images are loaded from images/ by that script.
name: kx21-offline
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: kx
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kx"]
      interval: 5s
      retries: 10

  api:
    image: kx21-api:${KX_VERSION:?set KX_VERSION}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kx:${POSTGRES_PASSWORD}@db:5432/kx
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (at least 32 characters)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-expo}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-none}
      IDENTITY_API_URL: ${IDENTITY_API_URL:-https://s.api.ir/api/sw1/PersonInfo}
      IDENTITY_API_TOKEN: ${IDENTITY_API_TOKEN:-}
      IDENTITY_REQUIRED: ${IDENTITY_REQUIRED:-false}
      WEBINAR_URL: ${WEBINAR_URL:-}
      WEBINAR_APP_ID: ${WEBINAR_APP_ID:-kx-commissions}
      WEBINAR_APP_SECRET: ${WEBINAR_APP_SECRET:-}
      MAX_RECORDING_MB: ${MAX_RECORDING_MB:-2048}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    image: kx21-web:${KX_VERSION}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5000}:80"

volumes:
  db-data:
  uploads:
